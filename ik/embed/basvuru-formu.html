<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bize Katılın — İş Başvuru Formu | Paketçiniz</title>
<style>
  :root { --pk-blue: #2563eb; --pk-blue-dark: #1d4ed8; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f9fafb;
    color: #111827;
    padding: 40px 16px;
  }
  .pk-wrap { max-width: 720px; margin: 0 auto; }
  .pk-logo { display: flex; justify-content: center; margin-bottom: 24px; }
  .pk-logo img { height: 56px; width: auto; object-fit: contain; }
  .pk-card { background: #fff; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1); overflow: hidden; }
  .pk-head { padding: 32px 32px 24px; border-bottom: 1px solid #f3f4f6; text-align: center; }
  .pk-head h1 { font-size: 20px; font-weight: 700; margin: 0 0 4px; color: #111827; }
  .pk-head p { font-size: 14px; color: #6b7280; margin: 0; }
  form { padding: 32px; display: flex; flex-direction: column; gap: 16px; }
  .pk-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  @media (min-width: 600px) { .pk-grid { grid-template-columns: 1fr 1fr; } }
  label { display: block; font-size: 12px; font-weight: 600; color: #6b7280; margin-bottom: 6px; }
  .input-field {
    width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #e5e7eb;
    border-radius: 12px; background: #fff; color: #111827; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input-field:focus { border-color: var(--pk-blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  textarea.input-field { min-height: 90px; resize: vertical; font-family: inherit; }
  .pk-submit {
    width: 100%; padding: 14px; font-size: 14px; font-weight: 700; color: #fff;
    background: var(--pk-blue); border: none; border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .15s;
  }
  .pk-submit:hover { background: var(--pk-blue-dark); }
  .pk-submit:disabled { opacity: .6; cursor: not-allowed; }
  .pk-error {
    padding: 12px 16px; background: #fef2f2; border: 1px solid #fee2e2;
    border-radius: 12px; font-size: 14px; color: #dc2626;
  }
  .pk-success {
    max-width: 480px; margin: 0 auto; background: #fff; border-radius: 24px;
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); padding: 40px 32px; text-align: center;
  }
  .pk-success-icon {
    width: 64px; height: 64px; border-radius: 50%; background: #ecfdf5;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .pk-success h1 { font-size: 18px; font-weight: 700; margin: 0 0 8px; color: #111827; }
  .pk-success p { font-size: 14px; color: #6b7280; margin: 0; }
  .pk-spinner {
    width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff; border-radius: 50%; animation: pk-spin 0.6s linear infinite;
  }
  @keyframes pk-spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

    <!-- Form -->
    <div id="pk-form-card" class="pk-card">
      <div class="pk-head">
        <h1>Bize Katılın — İş Başvuru Formu</h1>
        <p>Paketçiniz ailesine katılmak için aşağıdaki formu doldurun, ekibimiz sizinle iletişime geçecektir.</p>
      </div>
      <form id="pk-basvuru-form">
        <div id="pk-error" class="pk-error" style="display:none"></div>
        <div class="pk-grid">
          <div>
            <label for="pk-ad_soyad">Ad Soyad *</label>
            <input class="input-field" id="pk-ad_soyad" name="ad_soyad" required placeholder="Adınız Soyadınız" />
          </div>
          <div>
            <label for="pk-telefon">Telefon *</label>
            <input class="input-field" id="pk-telefon" name="telefon" required placeholder="05XX XXX XX XX" />
          </div>
          <div>
            <label for="pk-email">E-posta</label>
            <input class="input-field" type="email" id="pk-email" name="email" placeholder="ornek@mail.com" />
          </div>
          <div>
            <label for="pk-dogum_tarihi">Doğum Tarihi</label>
            <input class="input-field" type="date" id="pk-dogum_tarihi" name="dogum_tarihi" />
          </div>
          <div>
            <label for="pk-pozisyon">Başvurulan Pozisyon *</label>
            <select class="input-field" id="pk-pozisyon" name="pozisyon" required>
              <option value="">Seçiniz</option>
              <option>Kurye</option>
              <option>Bölge Sorumlusu</option>
              <option>Operasyon Sorumlusu</option>
              <option>Çağrı Merkezi</option>
              <option>Depo Personeli</option>
              <option>Diğer</option>
            </select>
          </div>
          <div>
            <label for="pk-sehir">Şehir / Bölge *</label>
            <select class="input-field" id="pk-sehir" name="sehir" required>
              <option value="">Seçiniz</option>
              <option>İzmir</option>
              <option>Afyonkarahisar</option>
              <option>Bursa</option>
              <option>Muğla</option>
              <option>Osmaniye</option>
              <option>Kütahya</option>
              <option>Diğer</option>
            </select>
          </div>
          <div>
            <label for="pk-ehliyet">Sürücü Belgesi</label>
            <input class="input-field" id="pk-ehliyet" name="ehliyet" placeholder="Örn: A2, B" />
          </div>
          <div>
            <label for="pk-arac">Araç Durumu</label>
            <input class="input-field" id="pk-arac" name="arac" placeholder="Örn: Motosiklet (kendine ait)" />
          </div>
        </div>

        <div>
          <label for="pk-deneyim">Deneyim</label>
          <input class="input-field" id="pk-deneyim" name="deneyim" placeholder="Önceki iş tecrübeleriniz" />
        </div>

        <div>
          <label for="pk-mesaj">Mesajınız</label>
          <textarea class="input-field" id="pk-mesaj" name="mesaj" placeholder="Eklemek istediğiniz notlar..."></textarea>
        </div>

        <button type="submit" id="pk-submit-btn" class="pk-submit">
          <span id="pk-submit-text">Başvuruyu Gönder</span>
        </button>
      </form>
    </div>

    <!-- Success message (hidden by default) -->
    <div id="pk-success-card" class="pk-success" style="display:none">
      <div class="pk-success-icon">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
      </div>
      <h1>Başvurunuz Alındı!</h1>
      <p>İlginiz için teşekkür ederiz. İK ekibimiz başvurunuzu değerlendirip size en kısa sürede dönüş yapacaktır.</p>
    </div>
  </div>

<script>
  // ----------------------------------------------------------------
  // AYAR: İK & Vardiya panelinizin yayında olduğu adresi buraya yazın.
  // Örn: 'https://ik.paketciniz.com' veya 'https://panel.paketciniz.com'
  // Backend zaten tüm originlere açık (CORS), bu form farklı bir
  // domainden (paketciniz.com) gönderim yapabilir.
  // ----------------------------------------------------------------
  var IK_API_BASE = 'https://ik-api.paketciniz.com';

  var form = document.getElementById('pk-basvuru-form');
  var errorBox = document.getElementById('pk-error');
  var submitBtn = document.getElementById('pk-submit-btn');
  var submitText = document.getElementById('pk-submit-text');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitText.innerHTML = '<span class="pk-spinner"></span> Gönderiliyor...';

    var payload = {
      ad_soyad: document.getElementById('pk-ad_soyad').value,
      telefon: document.getElementById('pk-telefon').value,
      email: document.getElementById('pk-email').value,
      dogum_tarihi: document.getElementById('pk-dogum_tarihi').value,
      pozisyon: document.getElementById('pk-pozisyon').value,
      sehir: document.getElementById('pk-sehir').value,
      ehliyet: document.getElementById('pk-ehliyet').value,
      arac: document.getElementById('pk-arac').value,
      deneyim: document.getElementById('pk-deneyim').value,
      mesaj: document.getElementById('pk-mesaj').value
    };

    fetch(IK_API_BASE + '/api/ik/basvuru', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (res) {
        if (!res.ok) {
          return res.json().catch(function () { return {}; }).then(function (data) {
            throw new Error(data.message || 'Başvuru gönderilemedi');
          });
        }
        return res.json();
      })
      .then(function () {
        document.getElementById('pk-form-card').style.display = 'none';
        document.getElementById('pk-success-card').style.display = 'block';
      })
      .catch(function (err) {
        errorBox.textContent = err.message || 'Başvuru gönderilemedi. Lütfen daha sonra tekrar deneyin.';
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitText.textContent = 'Başvuruyu Gönder';
      });
  });
</script>
</body>
</html>
