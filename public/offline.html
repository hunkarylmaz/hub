<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bağlantı Yok · Rezervasyo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f8fc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        color: #161b3c;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        text-align: center;
      }
      .icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: linear-gradient(135deg, #161b3c, #7c3aed);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: 700;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        font-size: 14px;
        color: #6b7280;
        line-height: 1.5;
        margin: 0 0 20px;
      }
      button {
        border: none;
        background: #161b3c;
        color: white;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">R</div>
      <h1>İnternet bağlantısı yok</h1>
      <p>Rezervasyo'ya şu anda erişilemiyor. Bağlantınızı kontrol edip tekrar deneyin.</p>
      <button onclick="location.reload()">Tekrar Dene</button>
    </div>
  </body>
</html>
